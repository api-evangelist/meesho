aid: meesho
name: Meesho
description: >-
  Meesho is one of India's largest online marketplaces, pioneering low-cost
  social commerce for Bharat (tier-2/3 towns and beyond). It connects lakhs of
  small and mid-sized suppliers directly with hundreds of millions of value-
  conscious buyers on a zero-commission model, spanning fashion, home, kitchen,
  electronics accessories and general merchandise. Suppliers list catalog,
  manage inventory, fulfil and ship orders, and reconcile returns/RTO through
  the Meesho Supplier Panel (supplier.meesho.com) and, for integrators, a
  partner-gated Supplier / Order-Management API (production host
  merchant.meesho.com; test host merchant.meeshotest.in) authenticated with
  Meesho-issued signed request headers rather than a public self-service
  developer program. Meesho is backed by Prosus Ventures, SoftBank Vision Fund
  and Y Combinator.
